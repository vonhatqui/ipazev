name: Build Clean ZevCheatiOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Swift & Build IPA (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Run Build Script
        run: |
          chmod +x ./build_macos.sh
          ./build_macos.sh

      - name: Upload Clean IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZevCheatiOS-Clean-IPA
          path: ZevCheatiOS.ipa
          if-no-files-found: error
          retention-days: 30
